[project]
name = "operatives"
version = "0.1.0"
description = "Multi-Platform Negative Comment Monitoring & Reporting System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis>=5.0.0",
    "arq>=0.26.0",
    "aiogram>=3.7.0",
    "telethon>=1.36.0",
    "openai>=1.30.0",
    "httpx[http2,socks]>=0.27.0",
    "playwright>=1.44.0",
    "cryptography>=42.0.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "instagrapi>=3.1.0",
    "twikit>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
